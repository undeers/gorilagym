# GorilaGym · Apache detrás del proxy de Dokploy (Traefik)
ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# IP real del cliente (Traefik envía X-Forwarded-For)
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

# Ruta de config.php en el volumen (definida en el Dockerfile)
PassEnv GG_CONFIG_FILE

# Traefik termina el SSL: avisar a PHP que la conexión original es HTTPS
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Doble protección para private/ (además de los .htaccess)
<LocationMatch "^/private/">
    Require all denied
</LocationMatch>
