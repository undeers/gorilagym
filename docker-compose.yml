# GorilaGym · Dokploy (tipo "Compose") o docker compose local
services:
  gorilagym:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@gorilagym.cl}
      SMTP_TLS: ${SMTP_TLS:-on}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-on}
      SMTP_AUTH: ${SMTP_AUTH:-on}
      GG_CRON: ${GG_CRON:-1}
    volumes:
      - gorilagym-storage:/var/www/html/private/storage
      - gorilagym-media:/var/www/html/media

volumes:
  gorilagym-storage:
  gorilagym-media:
